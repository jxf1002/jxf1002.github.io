<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="调整跑步速度并生成赛博风格跑步报告的在线运动小工具。"
    />
    <link rel="canonical" href="https://www.justful.cn/sport/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="贾师傅的小站" />
    <meta property="og:title" content="奔跑练习｜在线跑步速度工具" />
    <meta
      property="og:description"
      content="调整跑步速度并生成赛博风格跑步报告的在线运动小工具。"
    />
    <meta property="og:url" content="https://www.justful.cn/sport/" />
    <meta name="twitter:card" content="summary" />
    <title>奔跑练习｜在线跑步速度工具</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "奔跑练习",
        "description": "调整跑步速度并生成跑步报告的在线运动小工具。",
        "url": "https://www.justful.cn/sport/",
        "applicationCategory": "健康与健身应用",
        "operatingSystem": "Web Browser",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" }
      }
    </script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/assets/css/site.css?v=5" />
    <script src="/assets/js/common.js?v=3"></script>
  </head>
  <body class="tool-page">
    <header class="site-header">
      <a class="site-brand" href="/"
        ><img class="site-home-icon" src="/favicon.svg" alt="" /><span
          >贾师傅的小站</span
        ></a
      >
      <div class="site-actions">
        <button
          class="theme-toggle"
          data-theme-toggle
          onclick="toggleTheme()"
          aria-label="切换主题"
        >
          ☾
        </button>
      </div>
    </header>
    <main class="page">
      <section class="app is-paused" aria-label="跑步速度控制器">
        <header class="topbar">
          <div>
            <p class="eyebrow">RUN CLUB / 01</p>
            <h1>今天也要跑起来</h1>
          </div>
          <div class="pace-badge"><strong data-speed>8</strong>公里 / 小时</div>
        </header>

        <section class="scene" aria-label="卡通学生跑步动画">
          <div class="cloud one"></div>
          <div class="cloud two"></div>
          <div class="tree-line"></div>
          <div class="runner">
            <div class="runner-shadow"></div>
            <div class="head">
              <div class="hair"></div>
              <i class="eye left"></i><i class="eye right"></i
              ><i class="smile"></i>
            </div>
            <div class="neck"></div>
            <div class="arm back"><div class="hand"></div></div>
            <div class="shirt"></div>
            <div class="shorts"></div>
            <div class="arm front"><div class="hand"></div></div>
            <div class="leg back"><div class="shoe"></div></div>
            <div class="leg front"><div class="shoe"></div></div>
          </div>
          <div class="track"></div>
        </section>

        <section class="controls">
          <div class="control-head">
            <h2>跑步速度</h2>
            <span class="speed-value"><span data-speed>8</span> km/h</span>
          </div>
          <input
            data-speed-range
            type="range"
            min="1"
            max="20"
            value="8"
            step="1"
            aria-label="调整跑步速度"
          />
          <div class="range-labels"><span>慢跑</span><span>冲刺</span></div>
          <div class="action-row">
            <button data-start type="button">开始运动</button>
            <button class="secondary" data-finish type="button" disabled>
              结束运动
            </button>
          </div>
          <p class="timer">
            运动时间 <strong><span data-timer>00:00</span></strong>
          </p>
          <section class="report" data-report aria-live="polite">
            <h2>CYBER RUN REPORT // 训练完成</h2>
            <div class="report-grid">
              <div class="report-item">
                <span>运动时长</span><strong data-report-time>0 分钟</strong>
              </div>
              <div class="report-item">
                <span>平均速度</span><strong data-report-speed>0 km/h</strong>
              </div>
              <div class="report-item">
                <span>估算距离</span><strong data-report-distance>0 km</strong>
              </div>
              <div class="report-item">
                <span>卡路里消耗</span
                ><strong data-report-calories>0 kcal</strong>
              </div>
              <div class="report-item">
                <span>平均心率</span
                ><strong data-report-heart-rate>0 bpm</strong>
              </div>
              <div class="report-item">
                <span>平均配速</span><strong data-report-pace>0:00 /km</strong>
              </div>
            </div>
            <p class="report-note" data-report-note>
              等待下一次任务上传。数据为运动模型估算。
            </p>
          </section>
        </section>
      </section>
    </main>
    <footer class="site-footer">
      <p>Copyright © <span data-year></span> www.justful.cn版权所有</p>
      <p>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer"
          >京ICP备18007833号-1</a
        >
      </p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
