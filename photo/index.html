<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>图片格式转换｜贾师傅的小站</title>
    <meta
      name="description"
      content="纯前端批量图片格式转换工具，支持 JPG、PNG、WebP 互转，可打包成 ZIP 下载，图片不会上传到服务器。"
    />
    <meta
      name="keywords"
      content="图片格式转换,JPG,PNG,WebP,批量压缩,在线工具"
    />
    <link
      rel="canonical"
      href="https://www.justful.cn/photo/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="贾师傅的小站" />
    <meta property="og:title" content="图片格式转换｜贾师傅的小站" />
    <meta
      property="og:description"
      content="批量把图片转成 JPG / PNG / WebP，纯浏览器本地处理，一键打包下载。"
    />
    <meta
      property="og:url"
      content="https://www.justful.cn/photo/"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/assets/css/site.css?v=5" />
    <script src="/assets/js/common.js?v=3"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="/"
        ><img class="site-home-icon" src="/favicon.svg" alt="" /><span
          >贾师傅的小站</span
        ></a
      >
      <div class="site-actions">
        <button
          class="theme-toggle"
          data-theme-toggle
          onclick="toggleTheme()"
          aria-label="切换主题"
        >
          ☾
        </button>
      </div>
    </header>

    <main>
      <div class="tool-page">
        <div class="tool-main">
          <div class="app converter">
            <header class="app-header">
              <span class="header-icon" aria-hidden="true">🖼️</span>
              <div class="header-text">
                <h1>图片格式转换</h1>
                <p class="sub">
                  批量把图片转成 JPG / PNG / WebP，可打包成 ZIP
                  下载。全程在浏览器本地处理，图片不会上传。
                </p>
              </div>
              <span class="badge">纯前端 · 最多 20 张</span>
            </header>

            <!-- 上传区 -->
            <section
              class="drop-zone"
              id="dropZone"
              tabindex="0"
              role="button"
              aria-label="点击或拖拽上传图片"
            >
              <div class="drop-icon" aria-hidden="true">＋</div>
              <p class="drop-title">
                把图片拖到这里，或<button
                  type="button"
                  class="link-btn"
                  id="pickBtn"
                >
                  点击选择图片
                </button>
              </p>
              <p class="drop-hint">
                支持 JPG / PNG / WebP / GIF / BMP / AVIF 等，单次最多 20 张
              </p>
            </section>
            <input
              type="file"
              id="fileInput"
              accept="image/*"
              multiple
              hidden
            />

            <!-- 工具条 -->
            <div class="toolbar">
              <label class="field">
                <span>全部转为</span>
                <select class="control" id="globalFormat">
                  <option value="jpg" selected>JPG</option>
                  <option value="png">PNG</option>
                  <option value="webp">WebP</option>
                </select>
              </label>
              <label class="field">
                <span>质量 <em id="qualityValue">92%</em></span>
                <input
                  type="range"
                  id="quality"
                  min="0.3"
                  max="1"
                  step="0.01"
                  value="0.92"
                  aria-label="输出质量"
                />
              </label>
              <span class="hint">质量仅对 JPG / WebP 生效，PNG 为无损输出</span>
              <span class="spacer"></span>
              <button type="button" class="button" id="clearBtn" disabled>
                清空列表
              </button>
            </div>

            <!-- 文件列表 -->
            <div class="conv-table-wrap">
              <table class="conv-table" id="fileTable" hidden>
                <thead>
                  <tr>
                    <th>名称</th>
                    <th>大小</th>
                    <th>类型</th>
                    <th>转化为</th>
                    <th class="col-actions">操作</th>
                  </tr>
                </thead>
                <tbody id="fileBody"></tbody>
              </table>
              <p class="empty" id="emptyState">
                还没有添加图片，先在上方选择或拖拽文件吧
              </p>
            </div>

            <!-- 批量操作 -->
            <div class="batch-bar" id="batchBar" hidden>
              <span class="count" id="fileCount"></span>
              <div class="progress" id="progress" hidden>
                <span id="progressBar"></span>
              </div>
              <span class="spacer"></span>
              <button
                type="button"
                class="button button-primary"
                id="downloadAll"
              >
                打包下载 ZIP
              </button>
            </div>
          </div>
        </div>

        <footer class="site-footer">
          <p>Copyright © <span data-year></span> www.justful.cn版权所有</p>
          <p>
            <a
              href="https://beian.miit.gov.cn/"
              target="_blank"
              rel="noreferrer"
              >京ICP备18007833号-1</a
            >
          </p>
        </footer>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
