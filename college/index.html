<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="description"
      content="提供基于校友会、软科、武书连数据的中国大学排行榜。"
    />
    <meta name="keywords" content="贾师傅,大学排行榜,大学排行榜数据" />
    <title>大学排行榜-数据-贾师傅的小站</title>
    <link rel="stylesheet" href="/assets/css/site.css?v=4" />
    <script src="/assets/js/common.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="/"
        ><span class="site-home-icon">⌂</span><span>贾师傅的小站</span></a
      >
      <div class="site-actions">
        <button
          class="theme-toggle"
          data-theme-toggle
          onclick="toggleTheme()"
          aria-label="切换主题"
        >
          ☾
        </button>
      </div>
    </header>
    <main class="data-page">
      <section class="data-panel">
        <header class="data-header">
          <h1>大学排行榜</h1>
          <p data-ranking-description>正在加载数据...</p>
          <div class="year-links" data-year-links>
            <a class="button" href="/college/?year=2026">2026年</a
            ><a class="button" href="/college/?year=2025">2025年</a
            ><a class="button" href="/college/?year=2024">2024年</a
            ><a class="button" href="/college/?year=2023">2023年</a>
          </div>
        </header>
        <div class="filters">
          <input
            class="control"
            data-query
            type="search"
            placeholder="请输入大学名称"
          />
          <span class="province-filter">
            <select class="control" data-province aria-label="按省份筛选">
              <option value="">全部省份</option>
            </select>
            <button
              class="province-clear"
              type="button"
              data-province-clear
              aria-label="清除省份筛选"
              title="清除省份筛选"
              hidden
            >
              ×
            </button>
          </span>
          <button class="button" type="button" data-province-stats>
            省级统计
          </button>
          <label class="page-size-control">
            每页显示
            <select class="control" data-page-size>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            条
          </label>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>
                  <button class="sort-button" type="button" data-sort="default">
                    排名 ↕
                  </button>
                </th>
                <th>省内排名</th>
                <th>学校名称</th>
                <th class="desktop-only">
                  <button class="sort-button" data-sort="chinaxy">
                    校友会 ↕
                  </button>
                </th>
                <th class="desktop-only">
                  <button class="sort-button" data-sort="ranking">
                    软科 ↕
                  </button>
                </th>
                <th class="desktop-only">
                  <button class="sort-button" data-sort="wurank">
                    武书连 ↕
                  </button>
                </th>
                <th>排名平均值</th>
              </tr>
            </thead>
            <tbody data-table-body>
              <tr>
                <td class="empty" colspan="7">正在加载...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" data-pagination></div>
      </section>
    </main>
    <dialog class="province-dialog" data-province-dialog>
      <div class="province-dialog-header">
        <h2>省级统计</h2>
        <button
          class="dialog-close"
          type="button"
          data-province-dialog-close
          aria-label="关闭省级统计"
        >
          ×
        </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>
                <button
                  class="sort-button"
                  type="button"
                  data-province-default-sort
                >
                  排名 ↕
                </button>
              </th>
              <th>省份</th>
              <th>
                <button class="sort-button" type="button" data-province-sort>
                  大学数量 ↕
                </button>
              </th>
              <th>平均排名</th>
            </tr>
          </thead>
          <tbody data-province-stats-body>
            <tr>
              <td class="empty" colspan="4">正在加载...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </dialog>
    <footer class="site-footer">
      <p>Copyright © <span data-year></span> justful.cn版权所有</p>
      <p>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer"
          >京ICP备18007833号-1</a
        >
      </p>
    </footer>
    <script src="/assets/js/college.js?v=5"></script>
  </body>
</html>
