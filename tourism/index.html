<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="提供基于2023年数据的5A级旅游景区。" />
    <meta name="keywords" content="贾师傅,5A级旅游景区,5A级旅游景区数据" />
    <link rel="canonical" href="https://www.justful.cn/tourism/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="贾师傅的小站" />
    <meta property="og:title" content="5A级旅游景区数据｜贾师傅的小站" />
    <meta
      property="og:description"
      content="查询基于2023年数据整理的全国5A级旅游景区及所属地区。"
    />
    <meta property="og:url" content="https://www.justful.cn/tourism/" />
    <meta name="twitter:card" content="summary" />
    <title>5A级旅游景区-数据-贾师傅的小站</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "全国5A级旅游景区数据",
        "description": "基于2023年数据整理的全国5A级旅游景区及所属地区。",
        "url": "https://www.justful.cn/tourism/",
        "inLanguage": "zh-CN",
        "creator": { "@type": "Organization", "name": "贾师傅的小站" }
      }
    </script>
    <link rel="stylesheet" href="/assets/css/site.css" />
    <script src="/assets/js/common.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="/"
        ><img class="site-home-icon" src="/favicon.svg" alt="" /><span
          >贾师傅的小站</span
        ></a
      >
      <div class="site-actions">
        <button
          class="theme-toggle"
          data-theme-toggle
          onclick="toggleTheme()"
          aria-label="切换主题"
        >
          ☾
        </button>
      </div>
    </header>
    <main class="data-page tourism-page">
      <section class="data-panel">
        <header class="data-header">
          <h1>5A级旅游景区</h1>
          <p>（基于2023年数据制作）</p>
        </header>
        <div class="filters">
          <input
            class="control"
            data-query
            type="search"
            placeholder="请输入景点名称"
          /><select class="control" data-province>
            <option>全部</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>景区名称</th>
                <th>地区</th>
                <th class="desktop-only">级别</th>
                <th class="desktop-only">评定年份</th>
              </tr>
            </thead>
            <tbody data-table-body>
              <tr>
                <td class="empty" colspan="4">正在加载...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" data-pagination></div>
      </section>
    </main>
    <footer class="site-footer">
      <p>Copyright © <span data-year></span> www.justful.cn版权所有</p>
      <p>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer"
          >京ICP备18007833号-1</a
        >
      </p>
    </footer>
    <script src="/assets/js/tourism.js"></script>
  </body>
</html>
